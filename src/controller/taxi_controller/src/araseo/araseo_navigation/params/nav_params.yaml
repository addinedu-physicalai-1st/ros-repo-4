"$(var namespace)":
  controller_server:
    ros__parameters:
      controller_frequency: 20.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]
      enable_stamped_cmd_vel: false
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.05
        movement_time_allowance: 15.0
      general_goal_checker:
        stateful: true
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.1
        yaw_goal_tolerance: 3.141593
      FollowPath:
        plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        desired_linear_vel: 0.03
        min_approach_linear_velocity: 0.01
        lookahead_dist: 0.15
        min_lookahead_dist: 0.1
        max_lookahead_dist: 0.2
        lookahead_time: 1.0
        transform_tolerance: 0.1
        use_velocity_scaled_lookahead_dist: false
        approach_velocity_scaling_dist: 0.25
        use_collision_detection: false
        use_regulated_linear_velocity_scaling: true
        use_cost_regulated_linear_velocity_scaling: false
        use_rotate_to_heading: true
        rotate_to_heading_angular_vel: 0.3
        rotate_to_heading_min_angle: 0.7
        regulated_linear_scaling_min_radius: 0.2
        regulated_linear_scaling_min_speed: 0.02
        allow_reversing: false

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: "$(var odom_frame)"
        robot_base_frame: "$(var base_frame)"
        rolling_window: true
        width: 4
        height: 4
        resolution: 0.05
        footprint: "[[0.06, 0.06], [0.06, -0.06], [-0.06, -0.06], [-0.06, 0.06]]"
        footprint_padding: 0.0
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: false
          observation_sources: scan
          scan:
            topic: "$(var scan_topic)"
            max_obstacle_height: 2.0
            clearing: false
            marking: false
            data_type: "LaserScan"
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          enabled: false
          cost_scaling_factor: 3.0
          inflation_radius: 0.15
        always_send_full_costmap: true

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 2.0
        publish_frequency: 1.0
        global_frame: "$(var map_frame)"
        robot_base_frame: "$(var base_frame)"
        rolling_window: true
        width: 4
        height: 4
        resolution: 0.05
        footprint: "[[0.06, 0.06], [0.06, -0.06], [-0.06, -0.06], [-0.06, 0.06]]"
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: false
          observation_sources: scan
          scan:
            topic: "$(var scan_topic)"
            max_obstacle_height: 2.0
            clearing: false
            marking: false
            data_type: "LaserScan"
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          enabled: false
          cost_scaling_factor: 3.0
          inflation_radius: 0.15
        always_send_full_costmap: true

  route_server:
    ros__parameters:
      base_frame: "$(var base_frame)"
      boundary_radius_to_achieve_node: 0.04
      radius_to_achieve_node: 0.05
      smooth_corners: true
      smoothing_radius: 0.02
      enable_nn_search: true
      edge_cost_functions: ["DistanceScorer"]
      DistanceScorer:
        plugin: "nav2_route::DistanceScorer"

  velocity_smoother:
    ros__parameters:
      smoothing_frequency: 20.0
      scale_velocities: false
      feedback: "OPEN_LOOP"
      max_velocity: [0.25, 0.0, 1.5]
      min_velocity: [-0.25, 0.0, -1.5]
      max_accel: [2.5, 0.0, 3.2]
      max_decel: [-2.5, 0.0, -3.2]
      odom_topic: "odom"
      odom_duration: 0.1
      deadband_velocity: [0.0, 0.0, 0.0]
      velocity_timeout: 1.0
      enable_stamped_cmd_vel: false
