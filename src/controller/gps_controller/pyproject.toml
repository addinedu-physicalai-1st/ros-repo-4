[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dalimi-gps-gui3"
version = "0.1.0"
description = "GUI2 + 30fps-timed capture; Pos every frame; WebSocket every N frames (test)"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
